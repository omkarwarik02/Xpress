<div class="container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <div class="card">
    <div class="flex flex-col md:flex-row">

      <div class="w-full md:w-5/12 flex flex-col items-center justify-center gap-3 py-5">

        <div class="username">
          <label>Email</label>
          <input pInputText type="text" formControlName="email" />
        </div>

        <div class="password">
          <label>Password</label>
          <input pInputText type="password" formControlName="password" />
        </div>

        <div class="flex-btn1">
          <p-button 
            type="submit"
            label="Login" 
            icon="pi pi-user"
            class="w-full"
            styleClass="w-full">
          </p-button>
        </div>

      </div>

      <div class="flex-btn2">
        <p-button 
          label="Sign Up"
          icon="pi pi-user-plus"
          severity="success"
          class="w-full"
          (click)="register()">
        </p-button>
      </div>

    </div>
  </div>

</form>

</div>
